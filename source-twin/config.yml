schema: 1
coverage:
  code:
    include:
      - packages/sourcetwin/src/**/*.ts
      - app/**/*.ts
      - app/**/*.tsx
      - worker/**/*.ts
      - build/**/*.ts
      - vite.config.ts
      - next.config.ts
    exclude: []
    entities:
      - function
  tests:
    include:
      - packages/sourcetwin/tests/**/*.ts
      - tests/**/*.mjs
    exclude:
      - packages/sourcetwin/tests/helpers/**
    entities:
      - test
